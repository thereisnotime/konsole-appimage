name: Lint

on:
  push:
    branches: [master]
    paths: ['**.sh', 'justfile', '.github/workflows/**', 'build/**']
  pull_request:
    paths: ['**.sh', 'justfile', '.github/workflows/**', 'build/**']

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The scripts do the real work here, and a shell bug ships silently.
      # Several early failures (a glob that matched nothing, a redirect that
      # followed a symlink) would have been caught by this.
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning build/*.sh install.sh

  workflow-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = False
          for f in glob.glob('.github/**/*.yml', recursive=True):
              try:
                  yaml.safe_load(open(f))
                  print('ok  ', f)
              except Exception as e:
                  print('FAIL', f, e); bad = True
          sys.exit(1 if bad else 0)
          PY

  justfile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: extractions/setup-just@v2
      - name: Parse justfile
        run: just --list >/dev/null && echo "justfile parses"
