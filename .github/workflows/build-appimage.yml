name: Build Konsole AppImage

on:
  workflow_dispatch:
    inputs:
      neon_channel:
        description: "KDE neon channel to pull Konsole from"
        type: choice
        required: true
        default: user
        options: [user, testing, unstable]
      publish_release:
        description: "Attach the AppImage to a GitHub release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    # noble runner, matching the container and the target hosts
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # The build runs in a container rather than on the runner directly.
      # The runner carries a lot of preinstalled libraries that would otherwise
      # leak into the AppDir, and the neon repo must never touch a system whose
      # Qt6 stack matters.
      - name: Build AppImage in ubuntu:24.04
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e NEON_CHANNEL="${{ inputs.neon_channel }}" \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e STABLE_COPY=1 \
            -e UPDATE_INFO="gh-releases-zsync|${{ github.repository_owner }}|${{ github.event.repository.name }}|latest|Konsole-*-x86_64.AppImage.zsync" \
            ubuntu:24.04 \
            bash /work/build/build-appimage.sh

      - name: Show manifest and checksums
        run: |
          cat dist/manifest.txt
          echo
          cat dist/SHA256SUMS

      - name: Read version
        id: ver
        run: echo "version=$(cat dist/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          set -euo pipefail
          chmod +x dist/*.AppImage

          # Two AppImages are produced (versioned + the stable-named copy), so
          # pick one explicitly -- a glob here would pass the second as an
          # argument to the first.
          appimage="$(ls dist/Konsole-*-*-x86_64.AppImage | head -1)"
          echo "testing: $appimage"

          # The stable copy must be byte-identical to the versioned one.
          cmp "$appimage" dist/Konsole-x86_64.AppImage

          # It has to actually run.
          "./$appimage" --version

          "./$appimage" --appimage-extract >/dev/null
          # AppRun must be our script, not the symlink linuxdeploy leaves behind
          file squashfs-root/AppRun | grep -q "shell script"
          # and the binary must still be a real ELF
          file squashfs-root/usr/bin/konsole | grep -q ELF
          # the AppRun must not leak loader/Qt paths into the spawned shell
          for leak in LD_LIBRARY_PATH QT_PLUGIN_PATH QML2_IMPORT_PATH; do
            if grep -q "$leak" squashfs-root/AppRun; then
              echo "AppRun exports $leak -- it would leak into the spawned shell"
              exit 1
            fi
          done
          # highest glibc requirement must not exceed the noble target
          max=$(find squashfs-root/usr -type f \( -name '*.so*' -o -name konsole \) \
                -exec objdump -T {} \; 2>/dev/null \
                | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -uV | tail -1)
          echo "max glibc requirement: $max"
          test "$(printf '%s\nGLIBC_2.39\n' "$max" | sort -V | tail -1)" = "GLIBC_2.39"
          rm -rf squashfs-root

          # zsync must exist, or AppImageUpdate silently cannot update
          test -n "$(ls dist/*.zsync 2>/dev/null)"
          echo "smoke test passed"

      - uses: actions/upload-artifact@v4
        with:
          name: konsole-appimage-${{ steps.ver.outputs.version }}
          path: |
            dist/*.AppImage
            dist/*.zsync
            dist/SHA256SUMS
            dist/manifest.txt
          if-no-files-found: error

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ steps.ver.outputs.version }}"
          notes=$(mktemp)
          {
            echo "Unofficial Konsole AppImage, built from KDE neon packages on an Ubuntu 24.04 base."
            echo
            echo "Not affiliated with or endorsed by KDE. See NOTICE.md."
            echo
            echo "Install:"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash"
            echo '```'
            echo
            echo '```'
            cat dist/manifest.txt
            echo '```'
          } > "$notes"

          # Collect whatever actually exists rather than relying on globs that
          # abort the step when one of them matches nothing.
          shopt -s nullglob
          assets=( dist/*.AppImage dist/*.zsync dist/SHA256SUMS dist/manifest.txt )
          printf 'uploading:\n'; printf '  %s\n' "${assets[@]}"
          test ${#assets[@]} -gt 0 || { echo "no assets to upload"; exit 1; }

          gh release create "$tag" \
            --title "Konsole ${{ steps.ver.outputs.version }}" \
            --notes-file "$notes" \
            "${assets[@]}" \
          || gh release upload "$tag" "${assets[@]}" --clobber
